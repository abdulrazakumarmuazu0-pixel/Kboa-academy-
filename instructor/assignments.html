<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - KBOA Instructor</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
    .admin-filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
    .admin-search{flex:1;min-width:200px;position:relative;}
    .admin-search input{width:100%;padding:12px 15px 12px 45px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;}
    .admin-search::before{content:'🔍';position:absolute;left:15px;top:50%;transform:translateY(-50%);}
    .admin-select{padding:12px 15px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;cursor:pointer;background:white;}
    .data-table-card{background:white;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .table-scroll{overflow-x:auto;}
    .data-table{width:100%;border-collapse:collapse;min-width:640px;}
    .data-table th{background:var(--gray-50);padding:14px 15px;text-align:left;font-size:0.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
    .data-table td{padding:14px 15px;border-bottom:1px solid var(--gray-100);font-size:0.92rem;color:var(--gray-700);vertical-align:middle;}
    .data-table tbody tr:hover{background:var(--gray-50);}
    .user-cell{display:flex;align-items:center;gap:12px;}
    .user-avatar-sm{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:white;flex-shrink:0;}
    .status-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;white-space:nowrap;text-transform:capitalize;}
    .action-btns{display:flex;gap:6px;}
    .action-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--gray-200);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;transition:all .15s;}
    .action-btn:hover{background:var(--gray-100);}
    .action-btn.ok:hover{background:#d1fae5;}
    .action-btn.danger:hover{background:#fee2e2;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.show{display:flex;}
    .modal-content{background:white;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:20px 25px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
    .modal-body{padding:25px;}
    .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray-500);}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-weight:600;margin-bottom:7px;color:var(--gray-700);font-size:0.92rem;}
    .form-control{width:100%;padding:11px 14px;border:1px solid var(--gray-300);border-radius:8px;font-family:inherit;font-size:0.98rem;}
    .form-control:focus{outline:none;border-color:var(--primary-color);}
    .empty-row td{text-align:center;padding:40px;color:var(--gray-500);}
</style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><img src="../assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">Instructor</span><button class="sidebar-close" id="sidebar-close">✕</button></div>
    <nav class="sidebar-nav"><ul><li><a href="dashboard.html" class="sidebar-link"><span class="icon">📊</span><span>Dashboard</span></a></li><li><a href="courses.html" class="sidebar-link"><span class="icon">📚</span><span>My Courses</span></a></li><li><a href="create-course.html" class="sidebar-link"><span class="icon">➕</span><span>Create Course</span></a></li><li><a href="students.html" class="sidebar-link"><span class="icon">👨‍🎓</span><span>My Students</span></a></li><li><a href="assignments.html" class="sidebar-link active"><span class="icon">📝</span><span>Assignments</span></a></li><li><a href="quizzes.html" class="sidebar-link"><span class="icon">🧠</span><span>Quizzes</span></a></li><li><a href="grades.html" class="sidebar-link"><span class="icon">📊</span><span>Grades</span></a></li><li><a href="earnings.html" class="sidebar-link"><span class="icon">💰</span><span>Earnings</span></a></li></ul></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" onclick="logout()"><span class="icon">🚪</span><span>Logout</span></a></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button><h1 class="topbar-title">Assignments</h1></div>
                <div class="topbar-right"><div class="user-menu"><button class="user-btn"><div class="user-avatar" style="background:#1e40af;" id="tb-avatar">I</div><span class="user-name" id="tb-name">Instructor</span></button></div></div>
            </header>
            <div class="content" style="padding-top:25px;">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:25px;">
    <div><h2 class="content-title">📝 Assignments</h2><p class="content-subtitle">Create & grade student work</p></div>
    <button class="btn btn-primary" onclick="openCreate()">+ Create Assignment</button>
</div>

<div id="assign-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">
    <p style="color:var(--gray-500);">⏳ Loading…</p>
</div>

<div class="modal-overlay" id="create-modal"><div class="modal-content">
    <div class="modal-header"><h2>📝 Create Assignment</h2><button class="modal-close" onclick="closeModal('create-modal')">✕</button></div>
    <div class="modal-body">
        <div class="form-group"><label class="form-label">Title *</label><input class="form-control" id="a-title" placeholder="e.g., Module 2 Project"></div>
        <div class="form-group"><label class="form-label">Course *</label><select class="form-control" id="a-course"></select></div>
        <div class="form-group"><label class="form-label">Instructions *</label><textarea class="form-control" id="a-instructions" rows="4"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label class="form-label">Due Date *</label><input class="form-control" id="a-due" type="datetime-local"></div>
            <div class="form-group"><label class="form-label">Points</label><input class="form-control" id="a-points" type="number" value="100"></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="createAssign()">✅ Publish Assignment</button>
    </div>
</div></div></div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/instructor-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');
            var t=document.getElementById('menu-toggle'),c=document.getElementById('sidebar-close');
            if(t)t.onclick=function(){s.classList.add('show');o.classList.add('show');};
            if(c)c.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
            if(o)o.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
        });
        function logout(){auth.signOut().then(function(){window.location.href='../index.html';});}
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('modal-overlay'))e.target.classList.remove('show');});
        function esc(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;}
        function fmtDate(ts){return ts&&ts.toDate?ts.toDate().toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';}
        function initials(n){return (n||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
        var AVC=['#4f46e5','#f59e0b','#10b981','#8b5cf6','#ec4899','#0ea5e9'];
        function avColor(uid){var h=0;for(var i=0;i<uid.length;i++)h+=uid.charCodeAt(i);return AVC[h%AVC.length];}
        function statusBadge(s){var m={active:['#d1fae5','#065f46'],pending:['#fef3c7','#92400e'],published:['#d1fae5','#065f46'],draft:['#f1f5f9','#475569'],archived:['#f1f5f9','#475569'],success:['#d1fae5','#065f46'],failed:['#fee2e2','#991b1b'],graded:['#d1fae5','#065f46'],submitted:['#fef3c7','#92400e']};
            var c=m[s]||['#f1f5f9','#475569'];
            return '<span class="status-badge" style="background:'+c[0]+';color:'+c[1]+'">'+esc(s||'—')+'</span>';}
    </script>
    <script>
var MY = [];
document.addEventListener('DOMContentLoaded', async function() {
    var user = await Instr.requireInstructor();
    load(user.uid);
});

async function load(uid) {
    MY = await Instr.getMyCourses(uid);
    var list = await Instr.getAssignmentsForCourses(MY.map(function(c){return c.id;}));
    var box = document.getElementById('assign-list');
    if (!list.length) {
        box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--gray-500);">'
            + '<div style="font-size:3rem;margin-bottom:12px;">📝</div><h3>No assignments yet</h3>'
            + '<button class="btn btn-primary" style="margin-top:14px;" onclick="openCreate()">+ Create Assignment</button></div>';
        return;
    }
    box.innerHTML = list.map(function(a) {
        return '<div style="background:white;border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);">'
        + '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;">'
        + '<h4 style="font-weight:700;">'+esc(a.title)+'</h4>'
        + '<span class="status-badge" style="background:'+(a.pendingGrading>0?'#fef3c7':'#d1fae5')+';color:'+(a.pendingGrading>0?'#92400e':'#065f46')+';">'+(a.pendingGrading>0?a.pendingGrading+' to grade':'All graded')+'</span></div>'
        + '<p style="font-size:0.88rem;color:var(--gray-600);margin-bottom:12px;">'+esc((a.instructions||'').substring(0,120))+(a.instructions&&a.instructions.length>120?'…':'')+'</p>'
        + '<div style="display:flex;gap:14px;font-size:0.85rem;color:var(--gray-500);margin-bottom:14px;">'
        + '<span>📚 '+esc(courseTitle(a.courseId))+'</span>'
        + '<span>⏰ Due: '+fmtDate(a.dueDate)+'</span>'
        + '<span>📊 '+(a.points||100)+' pts</span>'
        + '<span>📤 '+(a.submissionCount||0)+' submitted</span></div>'
        + '<a href="grade-assignments.html?assignmentId='+a.id+'" class="btn btn-primary btn-sm" style="width:100%;">✅ Grade Submissions ('+(a.pendingGrading||0)+')</a>'
        + '</div>';
    }).join('');
}

function courseTitle(cid) { var c = MY.find(function(x){return x.id===cid;}); return c ? c.title : '—'; }

function openCreate() {
    var sel = document.getElementById('a-course');
    sel.innerHTML = MY.filter(function(c){return c.status==='published';}).map(function(c){
        return '<option value="'+c.id+'">'+esc(c.title)+'</option>';
    }).join('');
    if (!sel.options.length) { alert('Publish a course first.'); return; }
    document.getElementById('create-modal').classList.add('show');
}

async function createAssign() {
    var title = document.getElementById('a-title').value.trim();
    var instructions = document.getElementById('a-instructions').value.trim();
    var due = document.getElementById('a-due').value;
    if (!title || !instructions || !due) { alert('Fill all required fields.'); return; }
    await Instr.createAssignment({
        title: title,
        courseId: document.getElementById('a-course').value,
        instructions: instructions,
        dueDate: new Date(due),
        points: parseInt(document.getElementById('a-points').value) || 100,
        instructorId: auth.currentUser.uid
    });
    closeModal('create-modal');
    alert('✅ Assignment published! Students can now see it.');
    load(auth.currentUser.uid);
}
</script>
</body>
</html>
