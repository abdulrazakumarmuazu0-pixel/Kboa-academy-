<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes - KBOA Instructor</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
    .admin-filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
    .admin-search{flex:1;min-width:200px;position:relative;}
    .admin-search input{width:100%;padding:12px 15px 12px 45px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;}
    .admin-search::before{content:'🔍';position:absolute;left:15px;top:50%;transform:translateY(-50%);}
    .admin-select{padding:12px 15px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;cursor:pointer;background:white;}
    .data-table-card{background:white;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .table-scroll{overflow-x:auto;}
    .data-table{width:100%;border-collapse:collapse;min-width:640px;}
    .data-table th{background:var(--gray-50);padding:14px 15px;text-align:left;font-size:0.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
    .data-table td{padding:14px 15px;border-bottom:1px solid var(--gray-100);font-size:0.92rem;color:var(--gray-700);vertical-align:middle;}
    .data-table tbody tr:hover{background:var(--gray-50);}
    .user-cell{display:flex;align-items:center;gap:12px;}
    .user-avatar-sm{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:white;flex-shrink:0;}
    .status-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;white-space:nowrap;text-transform:capitalize;}
    .action-btns{display:flex;gap:6px;}
    .action-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--gray-200);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;transition:all .15s;}
    .action-btn:hover{background:var(--gray-100);}
    .action-btn.ok:hover{background:#d1fae5;}
    .action-btn.danger:hover{background:#fee2e2;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.show{display:flex;}
    .modal-content{background:white;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:20px 25px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
    .modal-body{padding:25px;}
    .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray-500);}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-weight:600;margin-bottom:7px;color:var(--gray-700);font-size:0.92rem;}
    .form-control{width:100%;padding:11px 14px;border:1px solid var(--gray-300);border-radius:8px;font-family:inherit;font-size:0.98rem;}
    .form-control:focus{outline:none;border-color:var(--primary-color);}
    .empty-row td{text-align:center;padding:40px;color:var(--gray-500);}
</style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><img src="../assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">Instructor</span><button class="sidebar-close" id="sidebar-close">✕</button></div>
    <nav class="sidebar-nav"><ul><li><a href="dashboard.html" class="sidebar-link"><span class="icon">📊</span><span>Dashboard</span></a></li><li><a href="courses.html" class="sidebar-link"><span class="icon">📚</span><span>My Courses</span></a></li><li><a href="create-course.html" class="sidebar-link"><span class="icon">➕</span><span>Create Course</span></a></li><li><a href="students.html" class="sidebar-link"><span class="icon">👨‍🎓</span><span>My Students</span></a></li><li><a href="assignments.html" class="sidebar-link"><span class="icon">📝</span><span>Assignments</span></a></li><li><a href="quizzes.html" class="sidebar-link active"><span class="icon">🧠</span><span>Quizzes</span></a></li><li><a href="grades.html" class="sidebar-link"><span class="icon">📊</span><span>Grades</span></a></li><li><a href="earnings.html" class="sidebar-link"><span class="icon">💰</span><span>Earnings</span></a></li></ul></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" onclick="logout()"><span class="icon">🚪</span><span>Logout</span></a></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button><h1 class="topbar-title">Quizzes</h1></div>
                <div class="topbar-right"><div class="user-menu"><button class="user-btn"><div class="user-avatar" style="background:#1e40af;" id="tb-avatar">I</div><span class="user-name" id="tb-name">Instructor</span></button></div></div>
            </header>
            <div class="content" style="padding-top:25px;">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:25px;">
    <div><h2 class="content-title">🧠 Quizzes</h2><p class="content-subtitle">Create quizzes & view performance</p></div>
    <button class="btn btn-primary" onclick="openCreate()">+ Create Quiz</button>
</div>

<div id="quiz-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:10px;">
    <p style="color:var(--gray-500);">⏳ Loading…</p>
</div>

<div class="modal-overlay" id="create-modal"><div class="modal-content" style="max-width:680px;">
    <div class="modal-header"><h2>🧠 Create Quiz</h2><button class="modal-close" onclick="closeModal('create-modal')">✕</button></div>
    <div class="modal-body">
        <div class="form-group"><label class="form-label">Quiz Title *</label><input class="form-control" id="q-title"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
            <div class="form-group"><label class="form-label">Duration (mins)</label><input class="form-control" id="q-dur" type="number" value="15"></div>
            <div class="form-group"><label class="form-label">Pass (%)</label><input class="form-control" id="q-pass" type="number" value="70"></div>
            <div class="form-group"><label class="form-label">Course</label><select class="form-control" id="q-course"></select></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <strong>Questions (<span id="q-count">0</span>)</strong>
            <button class="btn btn-outline btn-sm" onclick="addQuestion()">+ Add Question</button>
        </div>
        <div id="questions"></div>
        <button class="btn btn-primary btn-block btn-lg" style="margin-top:16px;" onclick="saveQuiz()">✅ Publish Quiz</button>
    </div>
</div></div></div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="js/instructor-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');
            var t=document.getElementById('menu-toggle'),c=document.getElementById('sidebar-close');
            if(t)t.onclick=function(){s.classList.add('show');o.classList.add('show');};
            if(c)c.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
            if(o)o.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
        });
        function logout(){auth.signOut().then(function(){window.location.href='../index.html';});}
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('modal-overlay'))e.target.classList.remove('show');});
        function esc(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;}
        function fmtDate(ts){return ts&&ts.toDate?ts.toDate().toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';}
        function initials(n){return (n||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
        var AVC=['#4f46e5','#f59e0b','#10b981','#8b5cf6','#ec4899','#0ea5e9'];
        function avColor(uid){var h=0;for(var i=0;i<uid.length;i++)h+=uid.charCodeAt(i);return AVC[h%AVC.length];}
        function statusBadge(s){var m={active:['#d1fae5','#065f46'],pending:['#fef3c7','#92400e'],published:['#d1fae5','#065f46'],draft:['#f1f5f9','#475569'],archived:['#f1f5f9','#475569'],success:['#d1fae5','#065f46'],failed:['#fee2e2','#991b1b'],graded:['#d1fae5','#065f46'],submitted:['#fef3c7','#92400e']};
            var c=m[s]||['#f1f5f9','#475569'];
            return '<span class="status-badge" style="background:'+c[0]+';color:'+c[1]+'">'+esc(s||'—')+'</span>';}
    </script>
    <script>
var MY = [], QLIST = [];
document.addEventListener('DOMContentLoaded', async function() {
    var user = await Instr.requireInstructor();
    MY = await Instr.getMyCourses(user.uid);
    load();
});

async function load() {
    var quizzes = await Instr.getQuizzesForCourses(MY.map(function(c){return c.id;}));
    var box = document.getElementById('quiz-list');
    if (!quizzes.length) {
        box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--gray-500);">'
            + '<div style="font-size:3rem;margin-bottom:12px;">🧠</div><h3>No quizzes yet</h3></div>';
        return;
    }
    box.innerHTML = quizzes.map(function(q) {
        return '<div style="background:white;border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100);">'
        + '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;">'
        + '<h4 style="font-weight:700;">'+esc(q.title)+'</h4>'
        + '<button class="action-btn danger" onclick="delQuiz(\''+q.id+'\')">🗑️</button></div>'
        + '<p style="font-size:0.85rem;color:var(--gray-500);">'+(q.questions||[]).length+' questions • '+q.durationMinutes+' mins • Pass: '+q.passMark+'%</p>'
        + '</div>';
    }).join('');
}

async function delQuiz(id) {
    if (!confirm('Delete this quiz?')) return;
    await db.collection('exams').doc(id).delete();
    load();
}

function openCreate() {
    var sel = document.getElementById('q-course');
    sel.innerHTML = MY.filter(function(c){return c.status==='published';}).map(function(c){
        return '<option value="'+c.id+'">'+esc(c.title)+'</option>';
    }).join('');
    if (!sel.options.length) { alert('Publish a course first.'); return; }
    document.getElementById('create-modal').classList.add('show');
}

function addQuestion() {
    QLIST.push({ question: '', options: ['','','',''], correctAnswer: 0, explanation: '' });
    renderQuestions();
}
function renderQuestions() {
    document.getElementById('q-count').textContent = QLIST.length;
    document.getElementById('questions').innerHTML = QLIST.map(function(q, i) {
        var opts = q.options.map(function(o, oi) {
            return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">'
            + '<input type="radio" name="c-'+i+'" '+(q.correctAnswer===oi?'checked':'')+' onchange="QLIST['+i+'].correctAnswer='+oi+'">'
            + '<input class="form-control" style="padding:8px 12px;font-size:0.9rem;" value="'+esc(o)+'" onchange="QLIST['+i+'].options['+oi+']=this.value" placeholder="Option '+(oi+1)+'"></div>';
        }).join('');
        return '<div style="background:var(--gray-50);border-radius:12px;padding:16px;margin-bottom:12px;">'
        + '<div style="display:flex;justify-content:space-between;margin-bottom:10px;"><strong>Q'+(i+1)+'</strong>'
        + '<button class="action-btn danger" onclick="QLIST.splice('+i+',1);renderQuestions();">🗑️</button></div>'
        + '<input class="form-control" style="margin-bottom:10px;" value="'+esc(q.question)+'" onchange="QLIST['+i+'].question=this.value" placeholder="Question text">'
        + opts + '</div>';
    }).join('');
}

async function saveQuiz() {
    var title = document.getElementById('q-title').value.trim();
    var valid = QLIST.filter(function(q){ return q.question.trim() && q.options.filter(function(o){return o.trim();}).length >= 2; });
    if (!title || !valid.length) { alert('Title + at least 1 complete question required.'); return; }
    await Instr.createQuiz({
        title: title,
        courseId: document.getElementById('q-course').value,
        courseName: document.getElementById('q-course').options[0] ? MY.find(function(c){return c.id===document.getElementById('q-course').value;}).title : '',
        durationMinutes: parseInt(document.getElementById('q-dur').value) || 15,
        passMark: parseInt(document.getElementById('q-pass').value) || 70,
        questions: valid
    });
    closeModal('create-modal');
    document.getElementById('q-title').value = '';
    QLIST = []; renderQuestions();
    alert('✅ Quiz published!');
    load();
}
</script>
</body>
</html>
