<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quizzes - KBOA</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
    .admin-filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
    .admin-search{flex:1;min-width:200px;position:relative;}
    .admin-search input{width:100%;padding:12px 15px 12px 45px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;}
    .admin-search::before{content:'🔍';position:absolute;left:15px;top:50%;transform:translateY(-50%);}
    .admin-select{padding:12px 15px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;cursor:pointer;background:white;}
    .data-table-card{background:white;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .table-scroll{overflow-x:auto;}
    .data-table{width:100%;border-collapse:collapse;min-width:640px;}
    .data-table th{background:var(--gray-50);padding:14px 15px;text-align:left;font-size:0.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
    .data-table td{padding:14px 15px;border-bottom:1px solid var(--gray-100);font-size:0.92rem;color:var(--gray-700);vertical-align:middle;}
    .data-table tbody tr:hover{background:var(--gray-50);}
    .user-cell{display:flex;align-items:center;gap:12px;}
    .user-avatar-sm{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:white;flex-shrink:0;}
    .status-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;white-space:nowrap;text-transform:capitalize;}
    .action-btns{display:flex;gap:6px;}
    .action-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--gray-200);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;transition:all .15s;}
    .action-btn:hover{background:var(--gray-100);}
    .action-btn.ok:hover{background:#d1fae5;}
    .action-btn.danger:hover{background:#fee2e2;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.show{display:flex;}
    .modal-content{background:white;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:20px 25px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
    .modal-body{padding:25px;}
    .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray-500);}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-weight:600;margin-bottom:7px;color:var(--gray-700);font-size:0.92rem;}
    .form-control{width:100%;padding:11px 14px;border:1px solid var(--gray-300);border-radius:8px;font-family:inherit;font-size:0.98rem;}
    .form-control:focus{outline:none;border-color:var(--primary-color);}
    .empty-row td{text-align:center;padding:40px;color:var(--gray-500);}
</style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><img src="assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">KBOA</span><button class="sidebar-close" id="sidebar-close">✕</button></div>
    <nav class="sidebar-nav"><ul>
        <li><a href="dashboard.html" class="sidebar-link"><span class="icon">🏠</span><span>Dashboard</span></a></li>
        <li><a href="my-courses.html" class="sidebar-link"><span class="icon">📚</span><span>My Courses</span></a></li>
        <li><a href="assignments.html" class="sidebar-link active"><span class="icon">📝</span><span>Assignments</span></a></li>
        <li><a href="quizzes.html" class="sidebar-link"><span class="icon">🧠</span><span>Quizzes</span></a></li>
        <li><a href="results.html" class="sidebar-link"><span class="icon">📊</span><span>Results</span></a></li>
        <li><a href="certificates.html" class="sidebar-link"><span class="icon">🏆</span><span>Certificates</span></a></li>
        <li><a href="payments.html" class="sidebar-link"><span class="icon">💳</span><span>Payments</span></a></li>
        <li><a href="profile.html" class="sidebar-link"><span class="icon">👤</span><span>Profile</span></a></li>
        <li><a href="settings.html" class="sidebar-link"><span class="icon">⚙️</span><span>Settings</span></a></li>
    </ul></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" onclick="auth.signOut().then(function(){location.href='index.html';})"><span class="icon">🚪</span><span>Logout</span></a></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button><h1 class="topbar-title">My Quizzes</h1></div>
            </header>
            <div class="content" style="padding-top:25px;">
<div style="margin-bottom:25px;">
    <h2 class="content-title">🧠 My Quizzes</h2>
    <p class="content-subtitle">Quizzes from your enrolled courses</p>
</div>
<div id="quiz-list" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;"><p style="color:var(--gray-500);">⏳ Loading…</p></div>

<h3 style="margin:30px 0 14px;">📊 My Attempts</h3>
<div class="data-table-card"><div class="table-scroll">
<table class="data-table"><thead><tr>
    <th>Quiz</th><th>Score</th><th>Result</th><th>Date</th>
</tr></thead><tbody id="attempt-body"><tr class="empty-row"><td colspan="4">⏳ Loading…</td></tr></tbody></table>
</div></div></div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');
            var t=document.getElementById('menu-toggle'),c=document.getElementById('sidebar-close');
            if(t)t.onclick=function(){s.classList.add('show');o.classList.add('show');};
            if(c)c.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
            if(o)o.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
        });
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('modal-overlay'))e.target.classList.remove('show');});
        function esc(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;}
        function fmtDate(ts){return ts&&ts.toDate?ts.toDate().toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';}
    </script>
    <script src="js/data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function() {
    auth.onAuthStateChanged(async function(user) {
        if (!user) { location.href = 'login.html'; return; }
        var enrollments = await KBOA.getMyEnrollments(user.uid);
        var courseIds = enrollments.map(function(e){return e.course.id;});

        // Quizzes for my courses
        var snap = await db.collection('exams').where('type', '==', 'quiz').get();
        var quizzes = snap.docs.map(function(d){return Object.assign({id:d.id}, d.data());})
            .filter(function(q){ return courseIds.indexOf(q.courseId) !== -1; });

        var attemptsSnap = await db.collection('exam_results').where('studentId', '==', user.uid).get();
        var attempts = attemptsSnap.docs.map(function(d){return Object.assign({id:d.id}, d.data());});

        var box = document.getElementById('quiz-list');
        if (!quizzes.length) {
            box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--gray-500);"><div style="font-size:3rem;margin-bottom:12px;">🧠</div><p>No quizzes published for your courses yet.</p></div>';
        } else {
            box.innerHTML = quizzes.map(function(q) {
                var myAttempt = attempts.filter(function(a){return a.examId===q.id;});
                var btn = myAttempt.length
                    ? '<button class="btn btn-outline btn-sm" style="width:100%;" onclick="location.href=\'exam.html?examId='+q.id+'\'">🔄 Retake</button>'
                    : '<button class="btn btn-primary btn-sm" style="width:100%;" onclick="location.href=\'exam.html?examId='+q.id+'\'">▶ Start Quiz</button>';
                return '<div style="background:white;border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);border-top:4px solid var(--primary-color);">'
                + '<h4 style="font-weight:700;margin-bottom:6px;">'+esc(q.title)+'</h4>'
                + '<p style="font-size:0.85rem;color:var(--gray-500);margin-bottom:12px;">🧠 '+(q.questions||[]).length+' questions • ⏱️ '+q.durationMinutes+' mins • 🎯 Pass: '+q.passMark+'%</p>'
                + (myAttempt.length ? '<p style="font-size:0.85rem;margin-bottom:10px;">Best: <strong style="color:'+(myAttempt.some(function(a){return a.passed;})?'#059669':'#dc2626')+';">'+Math.max.apply(null,myAttempt.map(function(a){return a.percentage;}))+'%</strong> ('+myAttempt.length+' attempt'+(myAttempt.length>1?'s':'')+')</p>' : '')
                + btn + '</div>';
            }).join('');
        }

        // Attempts table
        var quizAttempts = attempts.filter(function(a){ return quizzes.some(function(q){return q.id===a.examId;}); });
        var tb = document.getElementById('attempt-body');
        tb.innerHTML = quizAttempts.length ? quizAttempts.map(function(a) {
            return '<tr><td>'+esc(a.examTitle||'—')+'</td>'
            + '<td><strong style="color:'+(a.passed?'#059669':'#dc2626')+';">'+(a.percentage||0)+'%</strong></td>'
            + '<td><span class="status-badge" style="background:'+(a.passed?'#d1fae5':'#fee2e2')+';color:'+(a.passed?'#065f46':'#991b1b')+';">'+(a.passed?'Passed':'Failed')+'</span></td>'
            + '<td>'+fmtDate(a.submittedAt)+'</td></tr>';
        }).join('') : '<tr class="empty-row"><td colspan="4">No attempts yet.</td></tr>';
    });
});
</script>
</body>
</html>
