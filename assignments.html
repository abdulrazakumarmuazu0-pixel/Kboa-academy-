<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assignments - KBOA</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
    .admin-filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
    .admin-search{flex:1;min-width:200px;position:relative;}
    .admin-search input{width:100%;padding:12px 15px 12px 45px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;}
    .admin-search::before{content:'🔍';position:absolute;left:15px;top:50%;transform:translateY(-50%);}
    .admin-select{padding:12px 15px;border:1px solid var(--gray-300);border-radius:8px;font-size:0.95rem;cursor:pointer;background:white;}
    .data-table-card{background:white;border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden;}
    .table-scroll{overflow-x:auto;}
    .data-table{width:100%;border-collapse:collapse;min-width:640px;}
    .data-table th{background:var(--gray-50);padding:14px 15px;text-align:left;font-size:0.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;border-bottom:2px solid var(--gray-200);white-space:nowrap;}
    .data-table td{padding:14px 15px;border-bottom:1px solid var(--gray-100);font-size:0.92rem;color:var(--gray-700);vertical-align:middle;}
    .data-table tbody tr:hover{background:var(--gray-50);}
    .user-cell{display:flex;align-items:center;gap:12px;}
    .user-avatar-sm{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;color:white;flex-shrink:0;}
    .status-badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:0.78rem;font-weight:700;white-space:nowrap;text-transform:capitalize;}
    .action-btns{display:flex;gap:6px;}
    .action-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--gray-200);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.95rem;transition:all .15s;}
    .action-btn:hover{background:var(--gray-100);}
    .action-btn.ok:hover{background:#d1fae5;}
    .action-btn.danger:hover{background:#fee2e2;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.show{display:flex;}
    .modal-content{background:white;border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-header{padding:20px 25px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
    .modal-body{padding:25px;}
    .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--gray-500);}
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-weight:600;margin-bottom:7px;color:var(--gray-700);font-size:0.92rem;}
    .form-control{width:100%;padding:11px 14px;border:1px solid var(--gray-300);border-radius:8px;font-family:inherit;font-size:0.98rem;}
    .form-control:focus{outline:none;border-color:var(--primary-color);}
    .empty-row td{text-align:center;padding:40px;color:var(--gray-500);}
</style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><img src="assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">KBOA</span><button class="sidebar-close" id="sidebar-close">✕</button></div>
    <nav class="sidebar-nav"><ul>
        <li><a href="dashboard.html" class="sidebar-link"><span class="icon">🏠</span><span>Dashboard</span></a></li>
        <li><a href="my-courses.html" class="sidebar-link"><span class="icon">📚</span><span>My Courses</span></a></li>
        <li><a href="assignments.html" class="sidebar-link active"><span class="icon">📝</span><span>Assignments</span></a></li>
        <li><a href="quizzes.html" class="sidebar-link"><span class="icon">🧠</span><span>Quizzes</span></a></li>
        <li><a href="results.html" class="sidebar-link"><span class="icon">📊</span><span>Results</span></a></li>
        <li><a href="certificates.html" class="sidebar-link"><span class="icon">🏆</span><span>Certificates</span></a></li>
        <li><a href="payments.html" class="sidebar-link"><span class="icon">💳</span><span>Payments</span></a></li>
        <li><a href="profile.html" class="sidebar-link"><span class="icon">👤</span><span>Profile</span></a></li>
        <li><a href="settings.html" class="sidebar-link"><span class="icon">⚙️</span><span>Settings</span></a></li>
    </ul></nav>
    <div class="sidebar-footer"><a href="#" class="sidebar-link" onclick="auth.signOut().then(function(){location.href='index.html';})"><span class="icon">🚪</span><span>Logout</span></a></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button><h1 class="topbar-title">My Assignments</h1></div>
            </header>
            <div class="content" style="padding-top:25px;">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:20px;">
    <div><h2 class="content-title">📝 My Assignments</h2><p class="content-subtitle">Real deadlines from your instructors</p></div>
</div>
<div id="due-alert" style="display:none;background:#fee2e2;border-radius:12px;padding:16px 20px;margin-bottom:20px;color:#991b1b;font-weight:600;"></div>
<div id="assign-list" style="display:grid;gap:14px;"><p style="color:var(--gray-500);">⏳ Loading…</p></div>

<div class="modal-overlay" id="submit-modal"><div class="modal-content">
    <div class="modal-header"><h2>📤 Submit Assignment</h2><button class="modal-close" onclick="closeModal('submit-modal')">✕</button></div>
    <div class="modal-body">
        <p style="margin-bottom:14px;"><strong id="sm-title"></strong></p>
        <div style="border:3px dashed var(--gray-300);border-radius:12px;padding:30px;text-align:center;background:var(--gray-50);cursor:pointer;" onclick="document.getElementById('sm-file').click()">
            <div style="font-size:2.5rem;margin-bottom:8px;">📎</div>
            <p id="sm-file-name">Click to choose file</p>
            <input type="file" id="sm-file" style="display:none;" onchange="document.getElementById('sm-file-name').textContent=this.files[0].name">
        </div>
        <div class="form-group" style="margin-top:14px;"><label class="form-label">Notes for instructor</label><textarea class="form-control" id="sm-notes" rows="2"></textarea></div>
        <div id="sm-progress" style="display:none;margin-bottom:12px;"><div class="progress-bar"><div class="progress-fill" id="sm-bar" style="width:0%;"></div></div></div>
        <button class="btn btn-primary btn-block btn-lg" id="sm-btn" onclick="doSubmit()">✅ Submit</button>
    </div>
</div></div></div>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');
            var t=document.getElementById('menu-toggle'),c=document.getElementById('sidebar-close');
            if(t)t.onclick=function(){s.classList.add('show');o.classList.add('show');};
            if(c)c.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
            if(o)o.onclick=function(){s.classList.remove('show');o.classList.remove('show');};
        });
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        document.addEventListener('click',function(e){if(e.target.classList&&e.target.classList.contains('modal-overlay'))e.target.classList.remove('show');});
        function esc(t){var d=document.createElement('div');d.textContent=String(t==null?'':t);return d.innerHTML;}
        function fmtDate(ts){return ts&&ts.toDate?ts.toDate().toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';}
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="js/data.js"></script>
<script>
var ENROLLMENTS = [], ASSIGNMENTS = [], CURRENT_A = null;
document.addEventListener('DOMContentLoaded', async function() {
    auth.onAuthStateChanged(async function(user) {
        if (!user) { location.href = 'login.html'; return; }
        ENROLLMENTS = await KBOA.getMyEnrollments(user.uid);
        await loadAssignments(user.uid);
    });
});

async function loadAssignments(uid) {
    var list = [];
    for (var en of ENROLLMENTS) {
        var snap = await db.collection('assignments').where('courseId', '==', en.course.id).get();
        for (var d of snap.docs) {
            var a = Object.assign({ id: d.id, courseTitle: en.course.title }, d.data());
            var mySub = await db.collection('submissions').where('assignmentId', '==', a.id).where('studentId', '==', uid).limit(1).get();
            a.mySubmission = mySub.empty ? null : mySub.docs[0].data();
            list.push(a);
        }
    }
    ASSIGNMENTS = list.sort(function(a,b){ return (a.dueDate&&a.dueDate.seconds||0)-(b.dueDate&&b.dueDate.seconds||0); });
    render();
}

function render() {
    var box = document.getElementById('assign-list');
    if (!ASSIGNMENTS.length) {
        box.innerHTML = '<div style="text-align:center;padding:50px;color:var(--gray-500);"><div style="font-size:3rem;margin-bottom:12px;">📝</div><p>No assignments yet. Enjoy your learning!</p></div>';
        return;
    }
    var now = Date.now();
    var dueSoon = ASSIGNMENTS.filter(function(a){
        return !a.mySubmission && a.dueDate && a.dueDate.toDate && (a.dueDate.toDate().getTime() - now) < 86400000 && (a.dueDate.toDate().getTime() - now) > 0;
    });
    if (dueSoon.length) {
        var alert = document.getElementById('due-alert');
        alert.style.display = 'block';
        alert.textContent = '⏰ Due within 24h: ' + dueSoon.map(function(a){return a.title;}).join(', ');
    }
    box.innerHTML = ASSIGNMENTS.map(function(a) {
        var st = a.mySubmission ? (a.mySubmission.status||'submitted') : 'pending';
        var dueTxt = a.dueDate && a.dueDate.toDate ? a.dueDate.toDate().toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
        var overdue = !a.mySubmission && a.dueDate && a.dueDate.toDate && a.dueDate.toDate().getTime() < now;
        var scoreHtml = st === 'graded'
            ? '<span style="color:#059669;font-weight:700;">✓ '+(a.mySubmission.total||0)+'/'+(a.mySubmission.maxPoints||a.points||100)+'</span> <button class="btn btn-sm btn-outline" onclick="viewFeedback(\''+a.id+'\')">💬 Feedback</button>'
            : (st === 'submitted' ? '<span class="status-badge" style="background:#fef3c7;color:#92400e;">Grading…</span>' : '');
        var btn = !a.mySubmission
            ? '<button class="btn btn-primary btn-sm" onclick="openSubmit(\''+a.id+'\')">📤 Submit</button>'
            : (a.mySubmission.fileUrl ? '<a href="'+a.mySubmission.fileUrl+'" target="_blank" class="btn btn-sm btn-outline">📎 My File</a>' : '');
        return '<div style="background:white;border-radius:14px;padding:20px;box-shadow:var(--shadow-sm);border-left:4px solid '+(st==='graded'?'#10b981':overdue?'#ef4444':st==='submitted'?'#f59e0b':'#4f46e5')+';">'
        + '<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:10px;margin-bottom:8px;">'
        + '<div><h4 style="font-weight:700;">'+esc(a.title)+'</h4><p style="font-size:0.83rem;color:var(--gray-500);">📚 '+esc(a.courseTitle)+' • '+(a.points||100)+' points</p></div>'
        + '<span style="font-size:0.85rem;color:'+(overdue?'#dc2626':'var(--gray-500)')+';">⏰ '+(overdue?'OVERDUE — ':'Due: ')+dueTxt+'</span></div>'
        + '<p style="font-size:0.9rem;color:var(--gray-600);margin-bottom:12px;">'+esc(a.instructions||'')+'</p>'
        + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">'+scoreHtml+btn+'</div></div>';
    }).join('');
}

function openSubmit(aid) {
    CURRENT_A = ASSIGNMENTS.find(function(a){return a.id===aid;});
    document.getElementById('sm-title').textContent = CURRENT_A.title;
    document.getElementById('sm-file-name').textContent = 'Click to choose file';
    document.getElementById('sm-notes').value = '';
    document.getElementById('submit-modal').classList.add('show');
}

async function doSubmit() {
    var file = document.getElementById('sm-file').files[0];
    if (!file) { alert('Choose a file first.'); return; }
    if (file.size > 50 * 1024 * 1024) { alert('Max 50MB.'); return; }

    var btn = document.getElementById('sm-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Uploading…';
    document.getElementById('sm-progress').style.display = 'block';

    try {
        var uid = auth.currentUser.uid;
        var path = 'submissions/' + uid + '/' + Date.now() + '_' + file.name;
        var ref = firebase.storage().ref(path);
        var task = ref.put(file);
        task.on('state_changed', function(snap) {
            var pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            document.getElementById('sm-bar').style.width = pct + '%';
        });
        await task;
        var url = await ref.getDownloadURL();

        await db.collection('submissions').add({
            assignmentId: CURRENT_A.id,
            studentId: uid,
            courseId: CURRENT_A.courseId,
            fileName: file.name,
            fileUrl: url,
            filePath: path,
            notes: document.getElementById('sm-notes').value,
            status: 'submitted',
            submittedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        CURRENT_A.mySubmission = { status: 'submitted' };
        closeModal('submit-modal');
        btn.disabled = false;
        btn.textContent = '✅ Submit';
        document.getElementById('sm-progress').style.display = 'none';
        render();
        alert('✅ Assignment submitted!');
    } catch (e) {
        btn.disabled = false;
        btn.textContent = '✅ Submit';
        alert('❌ Upload failed: ' + e.message + '\n\n(Publish storage.rules in Firebase Console → Storage → Rules)');
    }
}

function viewFeedback(aid) {
    var a = ASSIGNMENTS.find(function(x){return x.id===aid;});
    if (a && a.mySubmission) alert('💬 INSTRUCTOR FEEDBACK\n\nScore: ' + (a.mySubmission.total||0) + '/' + (a.mySubmission.maxPoints||a.points||100) + '\n\n' + (a.mySubmission.feedback || 'No written feedback.'));
}
</script>
</body>
</html>
