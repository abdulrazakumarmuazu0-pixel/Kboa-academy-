<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - KBOA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <img src="assets/images/logo.png" alt="KBOA Logo">
                    </div>
                    <h1 class="auth-title">🔑 Forgot Password</h1>
                    <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
                </div>

                <div id="alert-container"></div>

                <form class="auth-form" id="forgot-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="Enter your registered email" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">
                        📧 Send Reset Link
                    </button>
                </form>

                <div class="auth-links">
                    Remember your password? <a href="login.html">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var btn = document.getElementById('reset-btn');
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                await auth.sendPasswordResetEmail(email);

                document.getElementById('alert-container').innerHTML = 
                    '<div class="alert alert-success">✅ Reset link sent! Check your email inbox (and spam folder).</div>';

                btn.textContent = '✓ Email Sent';
            } catch (error) {
                console.error('Reset error:', error);
                document.getElementById('alert-container').innerHTML = 
                    '<div class="alert alert-error">❌ ' + (error.code === 'auth/user-not-found' ? 'No account found with this email.' : 'Error sending reset email. Try again.') + '</div>';

                btn.textContent = '📧 Send Reset Link';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
