<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - KBOA</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <nav class="nav container">
            <div class="nav__logo">
                <img src="assets/images/logo.png" alt="KBOA Logo" class="logo-img">
                <span class="logo-text">KBOA</span>
            </div>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="index.html" class="nav__link">Home</a>
                    </li>
                    <li class="nav__item">
                        <a href="courses.html" class="nav__link active-link">Courses</a>
                    </li>
                    <li class="nav__item">
                        <a href="index.html#about" class="nav__link">About Us</a>
                    </li>
                    <li class="nav__item">
                        <a href="index.html#instructors" class="nav__link">Instructors</a>
                    </li>
                    <li class="nav__item">
                        <a href="index.html#pricing" class="nav__link">Pricing</a>
                    </li>
                    <li class="nav__item">
                        <a href="index.html#contact" class="nav__link">Contact</a>
                    </li>
                </ul>
                <div class="nav__auth">
                    <a href="login.html" class="btn btn-outline">Login</a>
                    <a href="register.html" class="btn btn-primary">Register</a>
                </div>
            </div>

            <div class="nav__toggle" id="nav-toggle">
                <span class="hamburger"></span>
            </div>
        </nav>
    </header>

    <!-- Courses Hero -->
    <section class="courses-hero">
        <div class="container">
            <h1>Explore Our Courses</h1>
            <p>Find the perfect course to build your skills</p>

            <!-- Search Bar -->
            <div class="search-bar">
                <input type="text" placeholder="Search courses..." id="search-input">
                <button class="btn btn-primary">🔍 Search</button>
            </div>
        </div>
    </section>

    <!-- Filters -->
    <section class="filters">
        <div class="container">
            <div class="filters-container">
                <button class="filter-btn active" data-category="all">All Courses</button>
                <button class="filter-btn" data-category="academic">Academic</button>
                <button class="filter-btn" data-category="digital">Digital Skills</button>
                <button class="filter-btn" data-category="business">Business</button>
                <button class="filter-btn" data-category="tech">AI & Tech</button>
            </div>
        </div>
    </section>

    <!-- Courses Grid -->
    <section class="courses-list section">
        <div class="container">
            <div class="courses__grid grid" id="courses-grid">
                <!-- Courses will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p>&copy; 2026 KBOA - Knowledge Bridge Online Academy. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/native-bridge.js"></script>
</body>
</html>
