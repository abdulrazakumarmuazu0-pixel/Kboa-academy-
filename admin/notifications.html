<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications - KBOA Admin</title><link rel="stylesheet" href="../css/styles.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-header"><span class="sidebar-title">KBOA Admin</span></div><nav class="sidebar-nav"><ul><li><a class="sidebar-link" href="dashboard.html">📊 Dashboard</a></li><li><a class="sidebar-link active" href="notifications.html">🔔 Notifications</a></li><li><a class="sidebar-link" href="students.html">👨‍🎓 Students</a></li></ul></nav></aside><main class="main-content"><header class="topbar"><h1 class="topbar-title">Send Notification</h1></header><div class="content"><div id="alert"></div><form id="form" style="max-width:720px;background:#fff;padding:24px;border-radius:16px;box-shadow:var(--shadow-sm)"><label>User UID</label><input id="uid" class="form-input" required><label>Title</label><input id="title" class="form-input" required maxlength="120"><label>Message</label><textarea id="body" class="form-input" rows="5" required maxlength="1000"></textarea><label>Type</label><select id="type" class="form-input"><option>system</option><option>course</option><option>assignment</option><option>live_class</option><option>certificate</option><option>admission</option></select><button class="btn btn-primary" type="submit">Send notification</button></form></div></main></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script><script src="../js/firebase-config.js"></script><script src="js/admin-data.js"></script><script>form.onsubmit=async e=>{e.preventDefault();alert.textContent='Sending…';try{await Admin.callFunction('sendNotification',{uid:uid.value,title:title.value,body:body.value,type:type.value});alert.textContent='Notification sent successfully.';form.reset()}catch(err){alert.textContent=err.message}}</script></body></html>
