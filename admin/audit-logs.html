<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Logs - KBOA Admin</title><link rel="stylesheet" href="../css/styles.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><img src="../assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">Admin</span></div><nav class="sidebar-nav"><ul><li><a href="dashboard.html" class="sidebar-link"><span class="icon">📊</span><span>Dashboard</span></a></li><li><a href="admissions.html" class="sidebar-link"><span class="icon">🎓</span><span>Admissions</span></a></li><li><a href="audit-logs.html" class="sidebar-link active"><span class="icon">🛡️</span><span>Audit Logs</span></a></li></ul></nav></aside><main class="main-content"><header class="topbar"><h1 class="topbar-title">Security Audit Logs</h1></header><div class="content"><div style="background:white;border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);overflow:auto"><table class="data-table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Details</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div></main></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script><script src="../js/firebase-config.js"></script><script src="js/admin-data.js"></script><script>const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};async function load(){await Admin.requireAdmin();const r=await Admin.callFunction('getAuditLogs',{limit:200});const a=r.data.logs||[];document.getElementById('rows').innerHTML=a.length?a.map(x=>`<tr><td>${x.createdAt?new Date(x.createdAt).toLocaleString():''}</td><td>${esc(x.actorUid)}</td><td><strong>${esc(x.action)}</strong></td><td>${esc(x.resourceType||'')} / ${esc(x.resourceId||'')}</td><td><code>${esc(JSON.stringify(x.metadata||{}))}</code></td></tr>`).join(''):'<tr><td colspan="5">No audit records.</td></tr>'}load().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="5">'+esc(e.message)+'</td></tr>');</script></body></html>
