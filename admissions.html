<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admissions - KBOA</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div class="dashboard"><aside class="sidebar"><div class="sidebar-header"><div class="sidebar-logo"><img src="assets/images/logo.png" alt="KBOA"></div><span class="sidebar-title">KBOA</span></div><nav class="sidebar-nav"><ul><li><a href="dashboard.html" class="sidebar-link"><span class="icon">📊</span><span>Dashboard</span></a></li><li><a href="courses.html" class="sidebar-link"><span class="icon">📚</span><span>Courses</span></a></li><li><a href="admissions.html" class="sidebar-link active"><span class="icon">🎓</span><span>Admissions</span></a></li><li><a href="my-courses.html" class="sidebar-link"><span class="icon">🎯</span><span>My Courses</span></a></li></ul></nav></aside>
<main class="main-content"><header class="topbar"><div class="topbar-left"><button class="menu-toggle" id="menu-toggle">☰</button><h1 class="topbar-title">Admissions</h1></div></header><div class="content"><div id="alert"></div><section style="background:white;border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);max-width:760px"><h2>🎓 Apply for Admission</h2><p style="color:var(--gray-600);margin:8px 0 20px">Submit your application securely. Your application status will appear below.</p><form id="form"><div class="form-group"><label class="form-label">Programme ID *</label><input id="programId" class="form-input" required placeholder="e.g. computer-science"></div><div class="form-group"><label class="form-label">Programme Name</label><input id="programName" class="form-input" placeholder="e.g. National Computer Science"></div><div class="form-group"><label class="form-label">Statement / Notes</label><textarea id="statement" class="form-input" rows="6" maxlength="3000" placeholder="Tell us briefly why you want to join..."></textarea></div><button class="btn btn-primary" id="submit">Submit Application</button></form><div id="result" style="margin-top:24px"></div></section></div></main></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script><script src="js/firebase-config.js"></script><script>
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
async function load(){const u=auth.currentUser;if(!u){location.href='login.html';return}const q=await db.collection('applications').where('applicantId','==',u.uid).orderBy('createdAt','desc').limit(10).get();document.getElementById('result').innerHTML=q.empty?'<p>No applications yet.</p>':q.docs.map(d=>{const x=d.data();return `<div style="border:1px solid var(--gray-200);padding:16px;border-radius:10px;margin-top:10px"><strong>${esc(x.programName||x.programId)}</strong><div>Status: <b>${esc(x.status||'submitted')}</b></div><small>${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():''}</small></div>`}).join('')}
auth.onAuthStateChanged(u=>{if(u)load();});document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;try{await firebase.functions().httpsCallable('createAdmissionApplication')({programId:document.getElementById('programId').value.trim(),programName:document.getElementById('programName').value.trim(),statement:document.getElementById('statement').value.trim()});document.getElementById('alert').innerHTML='<div class="alert alert-success">Application submitted successfully.</div>';e.target.reset();await load()}catch(err){document.getElementById('alert').innerHTML='<div class="alert alert-danger">'+esc(err.message)+'</div>'}finally{b.disabled=false}};
</script></body></html>
